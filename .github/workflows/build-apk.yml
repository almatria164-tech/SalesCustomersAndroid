name: Build APK and Export Source

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'SalesCustomersAndroid_*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "لم يتم العثور على ملف ZIP"
            exit 1
          fi

          echo "Using: $ZIP"
          mkdir -p project
          unzip -o "$ZIP" -d project

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/project" -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "لم يتم العثور على settings.gradle"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Upload extracted source
        uses: actions/upload-artifact@v4
        with:
          name: SalesCustomers-source
          path: project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SalesCustomers-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
