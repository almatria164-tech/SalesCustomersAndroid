name: Build APK and Export Source

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.config/.android"
          keytool -genkeypair \
            -v \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias AndroidDebugKey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Check signing SHA-1
        run: gradle signingReport --no-daemon

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SalesCustomers-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Source
        uses: actions/upload-artifact@v4
        with:
          name: SalesCustomers-source
          path: .
