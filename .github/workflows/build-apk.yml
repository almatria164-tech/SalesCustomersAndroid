name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract updated project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'SalesCustomersAndroid_*.zip' ! -name 'SalesCustomersAndroid_phone_ready.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "لم يتم العثور على ملف ZIP المعدل"
            exit 1
          fi

          echo "Using: $ZIP"
          unzip -o "$ZIP"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SalesCustomers-debug
          path: app/build/outputs/apk/debug/app-debug.apk
